[mypy]
# Global settings
ignore_missing_imports = True
explicit_package_bases = True
python_version = 3.13

# Suppress legacy agent versions (dynamic state machines, not worth strict checking)
[mypy-server.agents.isr_agent_multi_v2]
ignore_errors = True

[mypy-server.agents.isr_agent_multi_v3]
ignore_errors = True

[mypy-server.agents.versions.isr_agent_single_v1]
ignore_errors = True

# Suppress heavy agent/tool files that use dynamic dict[str,Any] patterns
[mypy-server.agents.isr_agent_multi_v4]
ignore_errors = True

[mypy-server.agents.mission_orchestration_tools]
ignore_errors = True

[mypy-server.agents.mission_tools]
ignore_errors = True

# Suppress complex solver algorithms
[mypy-server.solver.post_optimizer]
ignore_errors = True

[mypy-server.solver.post_optimizer_v1]
ignore_errors = True

[mypy-server.solver.solver_bridge]
ignore_errors = True

[mypy-server.solver.trajectory_planner]
ignore_errors = True

[mypy-server.solver.trajectory_planner_poly]
ignore_errors = True

[mypy-server.solver.sam_distance_matrix]
ignore_errors = True

# Suppress legacy webapp editor (separate project, not actively maintained)
[mypy-webapp.editor.solver.orienteering_interface]
ignore_errors = True
